<!DOCTYPE html>
<html lang="th">
<head>
    <base target="_top">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WORKTRACK</title>
    <style>
        html, body {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background: #f8f9fa;
            font-family: Arial, sans-serif;
        }

        .app-shell {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
        }

        .topbar {
            height: 56px;
            display: flex;
            align-items: center;
            padding: 0 16px;
            background: #ffffff;
            border-bottom: 1px solid #ddd;
            box-sizing: border-box;
        }

        .frame-wrap {
            flex: 1;
            min-height: 0;
        }

        iframe {
            display: block;
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="app-shell">
        <div class="topbar">
            WORKTRACK
        </div>

        <div class="frame-wrap">
            <iframe
                src="https://script.google.com/macros/s/AKfycby1YvojUG0g3c7LfUiY-fV7qEPJH26pQfABhPtO4DpXqXu9tHyi4iFv0sqlvWMYdMe7/exec"
                allow="geolocation; microphone; camera">
            </iframe>
        </div>
    </div>
</body>
</html>
